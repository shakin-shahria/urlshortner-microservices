apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  # Python environment variables
  FLASK_ENV: "production"
  # Go environment variables
  PORT: "8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: default
type: Opaque
data:
  # Standard base64 encoded placeholder values for production security
  # "supersecretkey" encoded in base64
  SECRET_KEY: c3VwZXJzZWNyZXRrZXk=